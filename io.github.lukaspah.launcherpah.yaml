id: io.github.lukaspah.launcherpah
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
    - org.freedesktop.Sdk.Extension.dotnet9
    - org.freedesktop.Sdk.Extension.node24
base: org.electronjs.Electron2.BaseApp
base-version: "24.08"

finish-args:
    - --share=ipc
    - --socket=x11
    - --socket=wayland
    - --socket=pulseaudio
    - --device=dri
    - --share=network
    - --filesystem=home
    - --env=TMPDIR=/var/tmp
    - --talk-name=org.freedesktop.Flatpak

command: run.sh

modules:
    - name: dotnet
      buildsystem: simple
      build-commands:
          - /usr/lib/sdk/dotnet9/bin/install.sh

    - name: io.github.lukaspah.launcherpah
      subdir: .
      buildsystem: simple

      build-options:
          append-path: /usr/lib/sdk/dotnet9/bin:/usr/lib/sdk/node24/bin
          prepend-path: "/usr/lib/sdk/dotnet9/bin"
          append-ld-library-path: "/usr/lib/sdk/dotnet9/lib"
          prepend-pkg-config-path: "/usr/lib/sdk/dotnet9/lib/pkgconfig"
          env:
              XDG_CACHE_HOME: /var/tmp
              npm_config_cache: /run/build/io.github.lukaspah.launcherpah/flatpak-node/npm-cache
              npm_config_nodedir: /usr/lib/sdk/node24
              npm_config_offline: "true"

      sources:
          - type: dir
            path: .
          - type: file
            url: https://github.com/electron/electron/releases/download/v42.4.0/electron-v42.4.0-linux-x64.zip
            sha256: 9a8194635548490a56099cc4c2b116738ae56834dee4472506d5a8b262bcbda4
            dest: electron-cache/6c702b0616b47d67d240ac49d5af99c5f632d2a5a5980f9b655ec34dce08fa94
            dest-filename: electron-v42.4.0-linux-x64.zip
          - type: file
            path: flatpak/io.github.lukaspah.launcherpah.desktop

      build-commands:
          - npm install --offline
          - mkdir -p /var/tmp/electron/6c702b0616b47d67d240ac49d5af99c5f632d2a5a5980f9b655ec34dce08fa94 && cp electron-cache/6c702b0616b47d67d240ac49d5af99c5f632d2a5a5980f9b655ec34dce08fa94/electron-v42.4.0-linux-x64.zip /var/tmp/electron/6c702b0616b47d67d240ac49d5af99c5f632d2a5a5980f9b655ec34dce08fa94/
          - npm run package -- --platform linux --arch x64
          - cp -a out/LauncherPAH-linux-x64 /app/main
          - cp images/icon.png /app/main/resources/icon.png
          - install -Dm755 flatpak/run.sh /app/bin/run.sh
          - install -Dm644 io.github.lukaspah.launcherpah.desktop /app/share/applications/io.github.lukaspah.launcherpah.desktop
          - install -Dm644 images/icon.png /app/share/icons/hicolor/256x256/apps/io.github.lukaspah.launcherpah.png
